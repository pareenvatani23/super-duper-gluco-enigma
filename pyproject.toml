[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glucofm"
version = "0.1.0"
description = "Independent open reimplementation of GlucoFM: a dual-stream JEPA foundation model for continuous glucose monitoring (arXiv:2605.30865)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=14.0", "huggingface_hub>=0.20"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["glucofm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
